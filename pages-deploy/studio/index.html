    </div><div class="nav-right"><div class="language-toggle" role="group" aria-label="Language"><button class="lang-option active" type="button" data-lang="en" aria-pressed="true">EN</button><button class="lang-option" type="button" data-lang="zh" aria-pressed="false">中文</button></div><div class="auth-area" id="authArea"></div></div>
  </nav></header>
  <main class="studio-shell">
    <section class="studio-intro">
      <div><a class="studio-back" href="/" data-home-link><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg><span data-i18n="back">Back to analyzer</span></a><h1 data-i18n="title">Resume PDF Studio</h1></div>
      <div class="studio-actions"><span id="saveIndicator" class="save-indicator" aria-live="polite"></span><button id="exportPdfBtn" type="button" class="button button-primary" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5"/></svg><span data-i18n="download">Export PDF</span></button></div>
    </section>
    <p id="handoffStatus" class="studio-notice sr-only" role="status" aria-live="polite"></p>
    <div class="compact-tools"><button id="editorOpen" class="button button-secondary button-sm" type="button" aria-controls="studioEditor" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6m-6 0v6"/></svg><span data-i18n="editContent">Edit content</span></button></div>
    <div class="studio-layout">
      <button id="editorBackdrop" class="editor-backdrop" type="button" aria-label="Close editor" hidden></button>
      <aside id="studioEditor" class="studio-sidebar glass" aria-labelledby="editorTitle">
        <div class="editor-mobile-heading"><h2 id="editorTitle" data-i18n="editContent">Edit content</h2><button id="editorClose" class="icon-button" type="button" aria-label="Close editor"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
        <div class="editor-tabs" role="tablist" aria-label="Editor"><button id="contentTab" role="tab" type="button" data-editor-tab="content" aria-selected="true" aria-controls="contentEditor" data-i18n="contentTab">Content</button><button id="styleTab" role="tab" type="button" data-editor-tab="style" aria-selected="false" aria-controls="styleEditor" tabindex="-1" data-i18n="styleTab">Style</button></div>
        <div id="contentEditor" role="tabpanel" aria-labelledby="contentTab">
          <div class="photo-row"><div id="photoPreview" class="photo-preview" aria-hidden="true"></div><label class="photo-upload" for="photoInput"><span data-i18n="uploadPhoto">Add a photo</span><span aria-hidden="true">＋</span></label><input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" class="photo-file"><button id="photoRemove" class="button button-quiet button-sm" type="button" hidden data-i18n="removePhoto">Remove</button></div><p id="photoStatus" class="studio-small is-error" role="status"></p>
          <details id="detailsPanel" class="editor-section" open><summary data-i18n="details">Personal details</summary>
            <div class="studio-field"><label for="fName" data-i18n="name">Full name</label><input id="fName" maxlength="120" autocomplete="name"></div>
            <div class="studio-field"><label for="fTitle" data-i18n="role">Professional title</label><input id="fTitle" maxlength="200"></div>
            <div class="studio-field"><label for="fContact" data-i18n="contact">Contact details & links</label><textarea id="fContact" rows="3" maxlength="1500"></textarea></div>
          </details>
          <div id="sectionFields"></div>
          <details id="importDetails" class="editor-section"><summary data-i18n="paste">Paste a complete resume</summary><label class="sr-only" for="rawResume" data-i18n="raw">Complete resume text</label><textarea id="rawResume" rows="7" maxlength="60000"></textarea><button id="applyText" class="button button-secondary button-sm" type="button" data-i18n="apply">Apply to fields</button></details>
          <button id="clearBtn" type="button" class="button button-quiet button-sm" data-i18n="clear">Clear draft</button>
        </div>
        <div id="styleEditor" role="tabpanel" aria-labelledby="styleTab" hidden><h2 class="editor-style-title" data-i18n="pageStyle">Page style</h2><div class="settings-row"><label><span data-i18n="fontSize">Text size</span><select id="fontSize"><option value="8">8 pt</option><option value="8.5">8.5 pt</option><option value="9">9 pt</option><option value="9.5">9.5 pt</option><option value="10">10 pt</option><option value="10.5" selected>10.5 pt</option><option value="11">11 pt</option><option value="11.5">11.5 pt</option><option value="12">12 pt</option><option value="12.5">12.5 pt</option><option value="13">13 pt</option><option value="13.5">13.5 pt</option><option value="14">14 pt</option><option value="14.5">14.5 pt</option><option value="15">15 pt</option><option value="15.5">15.5 pt</option><option value="16">16 pt</option></select></label><label><span data-i18n="lineSpacing">Line spacing</span><select id="lineSpacing"><option value="auto" data-i18n="templateSpacing">Template default</option><option value="1">1 ×</option><option value="1.15">1.15 ×</option><option value="1.3">1.3 ×</option><option value="1.5">1.5 ×</option><option value="1.75">1.75 ×</option><option value="2">2 ×</option></select></label><label><span data-i18n="headingLanguage">PDF headings</span><select id="contentLanguage"><option value="en">English</option><option value="zh">中文</option></select></label></div><p class="studio-small" id="templateCredit" hidden></p><a class="studio-small" href="/studio/credits.html" data-i18n="credits" target="_blank" rel="noopener">Template sources & licenses ↗</a></div>
        <p id="draftStatus" class="studio-small" role="status" hidden></p>
      </aside>
      <div id="studioWorkspace" class="studio-workspace">
        <section id="templatePanel" class="template-panel glass" aria-labelledby="templatesTitle"><div class="template-heading"><h2 id="templatesTitle" data-i18n="templates">Choose a template</h2><a id="templateTotal" class="template-total" href="/studio/templates/">All 30</a></div>
          <div class="carousel-shell"><button id="templatePrev" class="icon-button carousel-arrow previous" type="button" aria-label="Previous template"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button><div id="templateGrid" class="template-grid" role="group" aria-label="Resume templates"></div><button id="templateNext" class="icon-button carousel-arrow next" type="button" aria-label="Next template"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button></div>
          <div class="template-footer"><span id="selectedTemplate" role="status" aria-live="polite"></span><span id="templatePosition"></span></div>
        </section>
        <section id="studioPreview" class="studio-preview glass" aria-labelledby="previewTitle">
          <div class="preview-toolbar"><h2 id="previewTitle" data-i18n="preview">Resume preview</h2><div class="preview-controls"><label class="paper-control"><span class="sr-only" data-i18n="paper">Paper</span><select id="paper"><option value="a4">A4</option><option value="letter">US Letter</option></select></label><div class="zoom-controls"><button id="zoomOut" class="icon-button" type="button" aria-label="Zoom out">−</button><output id="zoomValue">85%</output><button id="zoomIn" class="icon-button" type="button" aria-label="Zoom in">＋</button></div><button id="previewFullscreen" class="icon-button" type="button" aria-label="Fullscreen preview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></svg></button></div></div>
          <p id="exportStatus" class="studio-status" role="status" aria-live="polite"></p>
          <div id="resumePreview"><div class="preview-empty"><div class="preview-empty-inner"><div class="empty-visual" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6m-6 5h6m-6 5h4"/></svg></div><h3 data-i18n="emptyTitle">Add your resume to preview.</h3><button id="emptyEdit" type="button" class="button button-secondary button-sm" data-i18n="editContent">Edit content</button></div></div></div>
        </section>
      </div>
    </div>
  </main>

  <div class="auth-backdrop" id="authBackdrop" aria-hidden="true"><section class="auth-dialog" id="authDialog" role="dialog" aria-modal="true" aria-labelledby="authTitle"></section></div>

  <script src="/scripts/auth-ui.js?v=20261023-profile3"></script>
  <script>window.studioPdfReady=import('/vendor/pdf.min.mjs').then(p=>{window.pdfjsLib=p;p.GlobalWorkerOptions.workerSrc='/vendor/pdf.worker.min.mjs';});window.studioPdfReady.catch(()=>{});</script>
  <script src="/studio/templates.js"></script><script src="/studio/engine.js"></script><script src="/studio/typst-adapter.js"></script><script src="/studio/typst-engine.js"></script><script src="/studio/studio.js"></script>
<script>
(function(){
  var m = location.search.match(/[?&]pass=([^&]+)/);
  if (!m) return;
  var pass = m[1];
  document.querySelectorAll('a[href="/"], a[href^="/?"]').forEach(function(a){
    var href = a.getAttribute('href');
    if (href.indexOf('pass=') === -1) {
      a.href = href + (href.indexOf('?') === -1 ? '?' : '&') + 'pass=' + encodeURIComponent(pass);
    }
  });
})();
</script>
</body>
</html>
