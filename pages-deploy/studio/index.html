<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历工作台 - CheckATS</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/styles/design.css">
<link rel="stylesheet" href="/styles/components.css">
<style>
  .result-card { opacity: 1 !important; transform: none !important; }
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
  }
  .template-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .template-card {
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    background: var(--surface);
  }
  .template-card:hover { border-color: var(--accent); }
  .template-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .template-card .tname { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .template-card .tdesc { font-size: 12px; color: var(--muted); }
  .photo-upload { display: flex; align-items: center; gap: 12px; }
  .photo-preview {
    width: 80px; height: 100px;
    border: 1px dashed var(--line);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 12px; color: var(--muted);
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  #resumePreview {
    background: white;
    min-height: 800px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 40px;
    box-shadow: var(--shadow-sm);
  }
  /* Template preview styles */
  .tpl-classic { font-family: Georgia, "Times New Roman", serif; }
  .tpl-classic h1 { font-size: 28px; border-bottom: 2px solid #1a1a1a; padding-bottom: 8px; margin-bottom: 8px; }
  .tpl-classic h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin: 20px 0 10px; }
  .tpl-modern { font-family: 'DM Sans', sans-serif; }
  .tpl-modern h1 { font-size: 28px; color: #1a1a1a; margin-bottom: 4px; }
  .tpl-modern h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; color: #2563eb; margin: 20px 0 10px; }
  .tpl-minimal { font-family: 'DM Sans', sans-serif; }
  .tpl-minimal h1 { font-size: 26px; font-weight: 300; letter-spacing: 1px; margin-bottom: 8px; }
  .tpl-minimal h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 3px; color: #888; margin: 24px 0 10px; }
  .resume-contact { color: #555; font-size: 14px; margin-bottom: 16px; }
  .resume-section { margin-bottom: 16px; }
  .resume-item { margin-bottom: 12px; }
  .resume-item-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  .resume-item-sub { color: #555; font-size: 14px; margin-bottom: 4px; }
  .resume-bullets { padding-left: 20px; font-size: 14px; }
  .resume-bullets li { margin-bottom: 4px; }
  .resume-photo { float: right; width: 100px; height: 125px; object-fit: cover; border-radius: 4px; margin-left: 16px; }

  @media print {
    .header, .container > div:first-child, .actions { display: none !important; }
    .container { display: block; max-width: none; padding: 0; margin: 0; }
    .preview-panel { position: static; }
    .panel { border: none; box-shadow: none; border-radius: 0; padding: 0; }
    #resumePreview { border: none; box-shadow: none; border-radius: 0; padding: 20px; min-height: auto; }
    body { background: white; }
  }
</style>
</head>
<body>
<header class="site-header"><div class="header-inner"><a href="/" class="brand">CheckATS</a><nav><a href="/">← 返回首页</a></nav></div></header>
<div style="max-width:1400px;margin:0 auto;padding:24px 24px 0;"><h1>简历工作台</h1></div>

<div class="container">
  <div>
    <div class="result-card">
      <h2>选择模板</h2>
      <div class="template-grid" id="templateGrid"></div>
    </div>

    <div class="result-card" style="margin-top: 16px;">
      <h2>基本信息</h2>
      <div class="form-group">
        <label>姓名</label>
        <input type="text" id="fName" placeholder="张三">
      </div>
      <div class="form-group">
        <label>求职意向 / 标题</label>
        <input type="text" id="fTitle" placeholder="软件工程师">
      </div>
      <div class="form-group">
        <label>联系方式（邮箱 | 电话 | 城市）</label>
        <input type="text" id="fContact" placeholder="zhangsan@example.com | 138-0000-0000 | 北京">
      </div>
      <div class="form-group">
        <label>照片（可选）</label>
        <div class="photo-upload">
          <div class="photo-preview" id="photoPreview">未上传</div>
          <div>
            <input type="file" id="photoInput" accept="image/*" style="display:none">
            <button class="button button-secondary" onclick="document.getElementById('photoInput').click()">上传照片</button>
            <button class="button button-secondary" id="photoRemove" style="display:none; margin-top: 8px;">移除</button>
          </div>
        </div>
      </div>
    </div>

    <div class="result-card" style="margin-top: 16px;">
      <h2>简历内容</h2>
      <div class="section-editor">
        <h3>个人简介</h3>
        <div class="form-group">
          <textarea id="fSummary" placeholder="3-5年经验概述..."></textarea>
        </div>
      </div>
      <div class="section-editor">
        <h3>工作经历（每段经历用空行分隔，格式：职位 | 公司 | 时间）</h3>
        <div class="form-group">
          <textarea id="fExperience" style="min-height: 160px;" placeholder="高级软件工程师 | 某某科技 | 2022年3月 - 至今&#10;- 负责...&#10;- 主导...&#10;&#10;软件工程师 | 另一家公司 | 2020年7月 - 2022年2月&#10;- 参与..."></textarea>
        </div>
      </div>
      <div class="section-editor">
        <h3>项目经历（格式同工作经历）</h3>
        <div class="form-group">
          <textarea id="fProjects" style="min-height: 120px;" placeholder="项目名称 | 技术栈&#10;- 描述..."></textarea>
        </div>
      </div>
      <div class="section-editor">
        <h3>教育背景</h3>
        <div class="form-group">
          <textarea id="fEducation" placeholder="某某大学 | 计算机科学学士 | 2016年9月 - 2020年6月"></textarea>
        </div>
      </div>
      <div class="section-editor">
        <h3>专业技能（逗号分隔）</h3>
        <div class="form-group">
          <input type="text" id="fSkills" placeholder="Python, FastAPI, React, PostgreSQL">
        </div>
      </div>
      <div class="section-editor">
        <h3>证书认证（每行一个）</h3>
        <div class="form-group">
          <textarea id="fCerts" placeholder="AWS Certified Solutions Architect&#10;PMP"></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="button button-secondary" id="loadAiBtn">从AI改写载入</button>
        <button class="button button-secondary" id="clearBtn">清空</button>
      </div>
    </div>
  </div>

  <div class="result-card preview-panel">
    <h2>实时预览</h2>
    <div id="resumePreview"></div>
    <div class="actions">
      <button class="button button-primary" id="exportPdfBtn">导出 PDF</button>
      <button class="button button-secondary" id="printBtn">打印 / 另存为PDF</button>
      <span id="exportStatus" style="font-size: 14px; color: var(--muted); align-self: center;"></span>
    </div>
  </div>
</div>

<script src="/vendor/pdf-lib.min.js"></script>
<script src="/vendor/fontkit.umd.min.js"></script>
<script src="templates.js"></script>
<script src="studio.js"></script>
</body>
</html>
