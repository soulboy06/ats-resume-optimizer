<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历工作台 - CheckATS</title>
<link rel="icon" href="/brand-mark.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles/design.css" />
<link rel="stylesheet" href="/styles/components.css" />
<style>
  .studio-wrap {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 24px;
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 900px) {
    .studio-wrap { grid-template-columns: 1fr; }
  }
  .studio-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }
  .studio-card h2 {
    font-size: 18px;
    margin: 0 0 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .studio-card h3 {
    font-size: 15px;
    margin: 20px 0 12px;
    color: var(--ink);
  }
  .studio-card h3:first-of-type { margin-top: 0; }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
    box-sizing: border-box;
  }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .field textarea { min-height: 100px; resize: vertical; }
  .template-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .template-card {
    border: 2px solid var(--line);
    border-radius: var(--radius-md);
    padding: 16px 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s var(--ease);
    background: var(--bg);
  }
  .template-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .template-card.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .template-card .tname { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .template-card .tdesc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .photo-row { display: flex; align-items: center; gap: 12px; }
  .photo-preview {
    width: 80px; height: 100px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 12px; color: var(--muted);
    background: var(--bg);
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .studio-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  #resumePreview {
    background: white;
    min-height: 800px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 48px;
    box-shadow: var(--shadow-sm);
  }
  /* 简历模板预览样式 */
  .tpl-classic { font-family: Georgia, "Times New Roman", "Songti SC", serif; color: #1a1a1a; }
  .tpl-classic h1 { font-size: 28px; border-bottom: 2px solid #1a1a1a; padding-bottom: 10px; margin: 0 0 8px; }
  .tpl-classic h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid #ccc; padding-bottom: 6px; margin: 22px 0 12px; }
  .tpl-modern { font-family: 'DM Sans', 'Noto Sans SC', sans-serif; color: #1a1a1a; }
  .tpl-modern h1 { font-size: 30px; margin: 0 0 6px; }
  .tpl-modern h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 2.5px; color: #b44d30; margin: 22px 0 12px; border-bottom: 2px solid #b44d30; padding-bottom: 6px; }
  .tpl-minimal { font-family: 'DM Sans', 'Noto Sans SC', sans-serif; color: #2a2a2a; }
  .tpl-minimal h1 { font-size: 26px; font-weight: 300; letter-spacing: 1px; margin: 0 0 8px; }
  .tpl-minimal h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 3px; color: #888; margin: 26px 0 12px; }
  .resume-contact { color: #555; font-size: 14px; margin-bottom: 8px; }
  .resume-section { margin-bottom: 16px; }
  .resume-item { margin-bottom: 14px; }
  .resume-item-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; font-size: 15px; }
  .resume-item-sub { color: #555; font-size: 14px; margin-bottom: 6px; }
  .resume-bullets { padding-left: 20px; font-size: 14px; margin: 0; }
  .resume-bullets li { margin-bottom: 5px; line-height: 1.6; }
  .resume-photo { float: right; width: 100px; height: 125px; object-fit: cover; border-radius: 4px; margin: 0 0 16px 16px; }
  @media print {
    .nav-shell, .studio-sidebar, .studio-actions, .page-title { display: none !important; }
    .studio-wrap { display: block; max-width: none; padding: 0; }
    #resumePreview { border: none; box-shadow: none; border-radius: 0; padding: 20px; }
    body { background: white !important; }
  }
</style>
</head>
<body>
  <header class="nav-shell">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg class="brand-symbol" viewBox="0 0 64 64" fill="#B44D30"><path d="M29 29C14 29 8 22 12 15c4-7 16-2 17 14Z"/><path d="M29 29C14 29 8 22 12 15c4-7 16-2 17 14Z" transform="rotate(90 32 32)"/><path d="M29 29C14 29 8 22 12 15c4-7 16-2 17 14Z" transform="rotate(180 32 32)"/><path d="M29 29C14 29 8 22 12 15c4-7 16-2 17 14Z" transform="rotate(270 32 32)"/><path d="m32 28 4 4-4 4-4-4Z"/></svg></span><span>CheckATS</span></a>
      <div class="nav-links">
        <a href="/">← 返回首页</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="studio-wrap">
      <div class="studio-sidebar">
        <div class="studio-card">
          <h2>选择模板</h2>
          <div class="template-grid" id="templateGrid"></div>
        </div>

        <div class="studio-card">
          <h2>基本信息</h2>
          <div class="field">
            <label>姓名</label>
            <input type="text" id="fName" placeholder="张三">
          </div>
          <div class="field">
            <label>求职意向 / 标题</label>
            <input type="text" id="fTitle" placeholder="软件工程师">
          </div>
          <div class="field">
            <label>联系方式（邮箱 | 电话 | 城市）</label>
            <input type="text" id="fContact" placeholder="zhangsan@example.com | 138-0000-0000 | 北京">
          </div>
          <div class="field">
            <label>照片（可选）</label>
            <div class="photo-row">
              <div class="photo-preview" id="photoPreview">未上传</div>
              <button class="button button-secondary button-sm" id="photoBtn">上传照片</button>
              <button class="button button-secondary button-sm" id="photoRemove" style="display:none">删除</button>
              <input type="file" id="photoInput" accept="image/*" style="display:none">
            </div>
          </div>
        </div>

        <div class="studio-card">
          <button class="button button-secondary" id="loadAiBtn" style="width:100%">从 AI 改写结果载入</button>
        </div>

        <div class="studio-card">
          <h2>简历内容</h2>
          <h3>个人简介</h3>
          <div class="field"><textarea id="fSummary" placeholder="3-5 年经验..."></textarea></div>
          <h3>工作经历</h3>
          <div class="field"><textarea id="fExperience" style="min-height:160px" placeholder="职位 | 公司 | 时间&#10;- 描述..."></textarea></div>
          <h3>项目经历</h3>
          <div class="field"><textarea id="fProjects" placeholder="项目名 | 技术栈&#10;- 描述..."></textarea></div>
          <h3>教育背景</h3>
          <div class="field"><textarea id="fEducation" placeholder="学校 | 专业 | 时间"></textarea></div>
          <h3>专业技能</h3>
          <div class="field"><input type="text" id="fSkills" placeholder="Python, React"></div>
          <h3>证书认证</h3>
          <div class="field"><textarea id="fCerts" style="min-height:60px" placeholder="每行一个"></textarea></div>
        </div>

        <div class="studio-card">
          <div class="studio-actions">
            <button class="button button-secondary" id="printBtn">打印 / 另存为PDF</button>
            <button class="button button-primary" id="exportPdfBtn">导出 PDF</button>
            <button class="button button-secondary" id="clearBtn">清空</button>
          </div>
          <div id="exportStatus" style="margin-top:12px;font-size:13px;color:var(--muted)"></div>
        </div>
      </div>

      <div class="studio-main">
        <div class="studio-card">
          <h2>实时预览</h2>
          <div id="resumePreview"></div>
        </div>
      </div>
    </div>
  </main>

<script src="./studio.js"></script>
</body>
</html>
